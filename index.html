<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrenos">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<title>Entrenos</title>
<link rel="apple-touch-icon" id="touchIcon" href="icon-180.png">
<link rel="icon" id="favIcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111318; --card:#1A1D24; --card2:#232733; --line:#2C313D;
  --text:#F3F1EC; --muted:#9AA0AD; --soft:#C9CCD3;
  --casa:#FF6B4A; --casa2:#FF9A5A; --run:#3CC9A8; --run2:#4FA3FF;
  --z0:#6B7280; --z1:#8FA3BF; --z2:#3CC9A8; --z3:#F2C14E; --z4:#FF8A3D; --z5:#F2545B;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:22px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F4F1EB; --card:#FFFFFF; --card2:#EFEBE3; --line:#E4DFD6;
    --text:#1A1C21; --muted:#6C707A; --soft:#41444B;
    --casa:#EC5530; --casa2:#F7894A; --run:#12A285; --run2:#2F86E0;
    --z0:#A3A8B0; --z1:#7D90AE; --z2:#12A285; --z3:#D9A520; --z4:#EC7424; --z5:#DD3C45;
    --shadow:0 10px 30px rgba(60,40,20,.10);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 100px)}
.top{margin:6px 2px 18px}
.top .date{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}
.top .date::first-letter{text-transform:uppercase}
.top h1{margin:2px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:26px 4px 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.bold{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* hero cards */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-bottom:12px;color:#fff;box-shadow:var(--shadow)}
.hero.casa{background:linear-gradient(135deg,var(--casa),var(--casa2))}
.hero.run{background:linear-gradient(135deg,var(--run),var(--run2))}
.hero .kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h3{margin:6px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0 0 16px;opacity:.92;font-size:14px}
.hero .deco{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .deco2{position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--soft)}

.btn{border:0;border-radius:99px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--text);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.white{background:#fff;color:#16181D}
.btn.ghostw{background:rgba(255,255,255,.18);color:#fff}
.btn.casa{background:var(--casa);color:#fff}
.btn.run{background:var(--run);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.danger{background:transparent;color:var(--z5);border:1px solid var(--line)}
.iconbtn{border:0;background:var(--card2);width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;padding:10px 0 8px;border-radius:16px;background:var(--card2)}
.day .l{font-size:11px;color:var(--muted);font-weight:700}
.day .n{font-size:16px;font-weight:800;margin:1px 0 4px}
.day .dots{display:flex;gap:3px;justify-content:center;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day.today{background:var(--text);color:var(--bg)}
.day.today .l{color:var(--bg);opacity:.7}
.dot-casa{background:var(--casa)} .dot-run{background:var(--run)}

.goal{margin-top:14px}
.goal .bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.goal .bar i{display:block;height:100%;border-radius:99px}

/* list items */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.badge{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;color:#fff}
.badge.casa{background:var(--casa)} .badge.run{background:var(--run)}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}

/* routine cards */
.rcard{cursor:pointer;display:block;text-align:left;width:100%}
.rcard .letter{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--casa),var(--casa2));color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.rcard .next{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--casa)}
.profile{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:12px;gap:2px}
.profile i{display:block;height:100%}

.zones .z{display:flex;align-items:center;gap:10px;padding:7px 0}
.zones .zb{min-width:44px;padding:0 6px;height:26px;border-radius:9px;color:#111;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.zones .zr{font-weight:800;font-variant-numeric:tabular-nums}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar .in{display:flex;max-width:520px;width:100%;justify-content:space-around}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px;cursor:pointer}
.tabbar button.on{color:var(--text)}
.tabbar svg{width:24px;height:24px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);animation:up .25s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input.in,select.in,textarea.in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--text)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.15)}
input[type=range]{width:100%;accent-color:var(--casa)}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .n{font-weight:800}
.ex .d{font-size:14px;color:var(--soft);margin-top:3px}
.ex .v{font-size:13px;color:var(--muted);margin-top:5px}
.ex .v b{color:var(--soft)}
.blockt{display:flex;justify-content:space-between;align-items:center;margin:18px 0 2px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--casa)}

/* player */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow:hidden}
.player::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--ph) 35%,transparent),transparent 70%);transition:background .4s;pointer-events:none}
.player > *{position:relative}
.pl-top{display:flex;justify-content:space-between;align-items:center;max-width:520px;width:100%;margin:0 auto}
.pl-segs{display:flex;gap:2px;height:5px;max-width:520px;width:100%;margin:12px auto 0}
.pl-segs i{flex:1;border-radius:9px;background:var(--line)}
.pl-segs i.done{background:var(--ph)}
.pl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:520px;width:100%;margin:0 auto;min-height:0}
.pl-tag{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--ph) 22%,transparent);color:var(--ph)}
.pl-name{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:14px 0 4px}
.pl-sub{color:var(--muted);font-weight:600;font-size:14px}
.ring{position:relative;width:min(62vw,250px);height:min(62vw,250px);margin:18px 0 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:min(17vw,68px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.ring .num span{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.pl-cues{font-size:14px;color:var(--soft);max-width:420px;margin:4px auto 0}
.pl-var{margin-top:8px;font-size:13px;color:var(--muted)}
.pl-var button{border:0;background:none;color:var(--ph);font-weight:700;cursor:pointer;padding:4px}
.pl-next{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;max-width:520px;width:100%;margin:0 auto 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.pl-ctrl{display:flex;justify-content:center;align-items:center;gap:22px}
.pl-ctrl .iconbtn{width:56px;height:56px}
.pl-ctrl .play{width:78px;height:78px;border-radius:50%;border:0;background:var(--ph);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--ph) 45%,transparent)}
.bpm{font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:10px}
.bpm small{font-size:16px;color:var(--muted);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:34px;height:34px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.banner{border-radius:18px;padding:14px 16px;margin-bottom:12px;background:color-mix(in srgb,var(--z3) 18%,var(--card));border:1px solid color-mix(in srgb,var(--z3) 40%,transparent);font-size:14px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--run)}
.switch input:checked + span::after{transform:translateX(20px)}
svg.chart{width:100%;height:auto;display:block}
.seg.sm button{padding:7px 4px;font-size:13px}
.fbk{padding:12px 0;border-bottom:1px solid var(--line)}
.fbk:last-of-type{border-bottom:0}
.linkbtn{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:0;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:14px}
</style>
</head>
<body>
<div class="app"><main id="view"></main></div>

<nav class="tabbar"><div class="in">
  <button data-tab="hoy" onclick="go('hoy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></button>
  <button data-tab="casa" onclick="go('casa')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg><span>Casa</span></button>
  <button data-tab="correr" onclick="go('correr')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v4M6 12l3-4 4 1 3 3 3 1M11 15l-1-5"/></svg><span>Correr</span></button>
  <button data-tab="progreso" onclick="go('progreso')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progreso</span></button>
  <button data-tab="ajustes" onclick="go('ajustes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
</div></nav>

<div id="player" class="player hidden"></div>
<div id="sheetWrap" class="sheet-wrap hidden" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   DATOS: EJERCICIOS
   ========================================================= */
const EX = {
  // Calentamiento
  marcha:{n:'Marcha con brazos',d:'Marcha en el sitio subiendo las rodillas a media altura y moviendo los brazos. Ve subiendo el ritmo poco a poco.'},
  cadera:{n:'Círculos de cadera',d:'De pie, manos en la cintura, círculos amplios. Mitad del tiempo hacia cada lado.'},
  gatocamello:{n:'Gato-camello',d:'A cuatro patas: redondea la espalda soltando aire y luego húndela cogiéndolo. Despacio.'},
  rot_tor:{n:'Rotaciones torácicas',d:'A cuatro patas, una mano en la nuca: abre el codo hacia el techo siguiéndolo con la mirada. 30 s por lado.'},
  sent_lenta:{n:'Sentadilla lenta',d:'Baja en 3 segundos hasta donde estés cómoda y sube normal. Rodillas en la dirección de la punta de los pies.'},
  balanceo:{n:'Balanceos de pierna',d:'Apoyada en la pared, balancea una pierna adelante y atrás, luego de lado a lado. 30 s por pierna.'},
  puente_act:{n:'Puente de activación',d:'Tumbada boca arriba, pies apoyados: sube la cadera apretando glúteo y aguanta 2 s arriba.'},

  // Con mancuernas
  goblet:{w:1,one:1,n:'Sentadilla goblet',d:'Una mancuerna vertical sujeta contra el pecho con las dos manos. Baja con el pecho alto y los codos entre las rodillas, y sube empujando el suelo con todo el pie.',f:'Bajando hasta rozar una silla.',h:'Bajada en 3 s y 1 s de pausa abajo.'},
  press_suelo:{w:1,n:'Press en el suelo',d:'Tumbada boca arriba, rodillas dobladas. Empuja las mancuernas hacia el techo y baja hasta que los brazos toquen suave el suelo, codos a unos 45° del cuerpo.',f:'Palmas mirándose (agarre neutro).',h:'Bajada en 3 s, o alternando brazos.'},
  zancada_m:{w:1,uni:1,n:'Zancada atrás con mancuernas',d:'Una mancuerna en cada mano, brazos colgando. Paso atrás bajando la rodilla trasera hacia el suelo, el peso en la pierna de delante. Vuelve empujando con el talón delantero.',f:'Con una sola mancuerna, o agarrada a una silla.',h:'Bajada en 3 s y pausa abajo.'},
  press_hombro:{w:1,n:'Press de hombros',d:'De pie, mancuernas a la altura de los hombros. Empuja hacia arriba sin arquear la lumbar (aprieta abdomen y glúteo) y baja controlando.',f:'Sentada con la espalda apoyada.',h:'Alternando brazos, sin balancear el tronco.'},
  rdl1_m:{w:1,uni:1,n:'Peso muerto a una pierna',d:'Una mancuerna en cada mano, de pie sobre una pierna con la rodilla un poco flexionada. Inclina el tronco llevando la otra pierna atrás en línea, espalda recta y mancuernas cerca de la pierna. Vuelve apretando glúteo.',f:'Punta del pie de atrás apoyada en el suelo (tipo patinete).',h:'Bajada en 3 s.'},
  hip_m:{w:1,one:1,n:'Hip thrust con mancuerna',d:'Espalda alta apoyada en el sofá, pies en el suelo. Mancuerna sobre la cadera (con una toalla debajo) sujeta con las manos. Sube la cadera hasta quedar recta y aprieta glúteo 1 s arriba.',f:'Tumbada en el suelo (puente) con la mancuerna encima.',h:'Las dos mancuernas encima, o a una pierna.'},
  rdl_m:{w:1,n:'Peso muerto rumano',d:'Mancuernas delante de los muslos, rodillas un poco flexionadas. Lleva la cadera atrás deslizando las mancuernas pegadas a las piernas hasta media tibia, espalda recta. Sube apretando glúteo.',f:'Recorrido corto, solo hasta las rodillas.',h:'Bajada en 3 s y pausa abajo.'},

const kgTxt = k=>String(Math.round(k*100)/100).replace('.',',');
function opciones(eq){
  const max = eq==='b'?2:1, m={};
  for(let a=0;a<=max;a++)for(let b=0;b<=max;b++)for(let c=0;c<=max;c++){
    const lado=2*a+1.5*b+1.25*c; if(!lado) continue;
    const kg=Math.round(lado*2*100)/100, n=a+b+c;
    if(!m[kg]||m[kg].n>n) m[kg]={kg,n,lado:[...Array(a).fill(2),...Array(b).fill(1.5),...Array(c).fill(1.25)].map(kgTxt).join(' + ')};
  }
  return Object.values(m).sort((x,y)=>x.kg-y.kg);
}

  return structuredClone(DEF);

const arr = v=>Array.isArray(v)?v:[v];
const getR = r=>typeof r==='string'?CASA.find(x=>x.id===r):r;
function snapKg(opts,v){ return opts.reduce((a,b)=>Math.abs(b.kg-v)<Math.abs(a.kg-v)?b:a).kg; }
/* Cómo se carga cada bloque:
   barra = barra larga · par = las dos mancuernas igual · solo = una mancuerna (puede llevar todos los discos)
   dos = cada ejercicio usa una mancuerna, así que pueden pesar distinto */
function modo(r,bi){
  r=getR(r); if(!r||!r.eq) return null; if(r.eq==='b') return 'barra';
  const w=r.bloques[bi].filter(k=>EX[k].w);
  if(w.length&&w.every(k=>EX[k].one)) return w.length===1?'solo':'dos';
  return 'par';
}
function opcBlk(r,bi){ const m=modo(r,bi); return (m==='barra'||m==='solo')?OPC.b:OPC.m; }
function pesoBlk(r,bi){
  r=getR(r); if(!r||!r.eq) return [];
  const n=modo(r,bi)==='dos'?2:1, d=arr(r.pesos[bi]);
  const st=S.pesos&&S.pesos[r.id]&&S.pesos[r.id][bi], src=st!=null?arr(st):d;
  return Array.from({length:n},(_,j)=>snapKg(opcBlk(r,bi), +(src[j]??src[0]??d[j]??d[0])));
}
const pesosRut = r=>getR(r).bloques.map((_,i)=>pesoBlk(r,i));
const blkTxt = a=>arr(a).map(kgTxt).join(' y ');
const rutTxt = p=>p.map(blkTxt).join(' / ');
function setPeso(id,bi,j,v){ S.pesos=S.pesos||{}; S.pesos[id]=pesosRut(id); S.pesos[id][bi][j]=+v; save(); toast(`Bloque ${bi+1}: ${blkTxt(S.pesos[id][bi])} kg`); }
function pesoEx(r,bi,ex){ const a=pesoBlk(r,bi); if(a.length>1){ const w=r.bloques[bi].filter(k=>EX[k].w); return a[Math.max(0,w.indexOf(ex))]; } return a[0]; }
function conBarra(eq,kg){ const bar=eq==='b'?+S.settings.barraL:+S.settings.barraM; return bar>0?` · ${kgTxt(kg+bar)} kg con barra`:''; }
function cargaTxt(r,bi,ex){
  const kg=pesoEx(r,bi,ex), m=modo(r,bi);
  if(m==='barra') return `Barra + ${kgTxt(kg)} kg`;
  return (m==='par'&&!EX[ex].one)?`2 × ${kgTxt(kg)} kg`:`1 mancuerna de ${kgTxt(kg)} kg`;
}
const MODO_TXT = {barra:'Discos en la barra',par:'Cada mancuerna',solo:'Una sola mancuerna',dos:'Una mancuerna por ejercicio'};
function montaje(r,bi){
  const m=modo(r,bi), a=pesoBlk(r,bi), opts=opcBlk(r,bi), L=k=>(opts.find(o=>o.kg===k)||{}).lado||'—';

  if(m==='par') return {name:`2 × ${kgTxt(a[0])} kg`,sub:`En cada lado: ${L(a[0])}${conBarra('m',a[0])}`,voz:`${kgTxt(a[0])} kilos en cada mancuerna. En cada lado, ${L(a[0])}`};
  if(m==='solo') return {name:`1 mancuerna de ${kgTxt(a[0])} kg`,sub:`En cada lado: ${L(a[0])}${conBarra('m',a[0])}`,voz:`Una sola mancuerna de ${kgTxt(a[0])} kilos. En cada lado, ${L(a[0])}`};
  const w=r.bloques[bi].filter(k=>EX[k].w);

    voz:`Una mancuerna de ${kgTxt(a[0])} kilos para ${EX[w[0]].n}, y otra de ${kgTxt(a[1])} para ${EX[w[1]].n}`};

const varOf = k=>+((S.var||{})[k])||0;
function setVar(k,v,el){ S.var=S.var||{}; S.var[k]=v; save(); if(el) el.parentNode.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===v+1)); }

/* Progresión por bloque: dos veces seguidas igual con el mismo peso → se ajusta */
const sameArr=(a,b)=>arr(a).length===arr(b).length&&arr(a).every((x,i)=>+x===+arr(b)[i]);
function stepArr(opts,a,d){ const ks=opts.map(o=>o.kg); return a.map(v=>{const i=ks.indexOf(v); return ks[Math.min(ks.length-1,Math.max(0,i+d))];}); }
function prevBlk(ref,bi){ return [...S.log].filter(l=>l.tipo==='casa'&&l.ref===ref&&Array.isArray(l.bloques)&&l.bloques[bi]!=null).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.ts||0)-(a.ts||0))[0]; }
function decide(r,bi,v,used){
  const res={next:[...used],vars:{},hint:''};
  if(!v) return res;
  const p=prevBlk(r.id,bi), same=p&&p.bloques[bi]===v&&p.pesos&&sameArr(p.pesos[bi],used);
  if(!same){ res.hint=v>0?'Apuntado. Si te vuelve a sobrar con este peso, la próxima subimos.':'Apuntado. Si vuelve a costarte tanto con este peso, bajamos.'; return res; }
  const w=r.bloques[bi].filter(k=>EX[k].w&&EX[k].f), st=stepArr(opcBlk(r,bi),used,v);
  if(v>0){
    const easy=w.filter(k=>varOf(k)<0);
    if(easy.length){ easy.forEach(k=>res.vars[k]=0); res.hint='Dos veces seguidas te ha sobrado: vuelves a la versión normal.'; }
    else if(!sameArr(st,used)){ res.next=st; res.hint=`Dos veces seguidas te ha sobrado: la próxima, ${blkTxt(st)} kg.`; }
    else { const nor=w.filter(k=>varOf(k)<1);
      if(nor.length){ nor.forEach(k=>res.vars[k]=1); res.hint='Ya llevas todos los discos posibles: la próxima vez, versión difícil.'; }
      else res.hint='Máximo peso y versión difícil: piensa en subir de nivel.'; }
  } else {
    const hard=w.filter(k=>varOf(k)>0);
    if(hard.length){ hard.forEach(k=>res.vars[k]=0); res.hint='Dos veces seguidas te ha costado mucho: vuelves a la versión normal.'; }
    else if(!sameArr(st,used)){ res.next=st; res.hint=`Dos veces seguidas te ha costado mucho: la próxima, ${blkTxt(st)} kg.`; }
    else { w.filter(k=>varOf(k)>-1).forEach(k=>res.vars[k]=-1); res.hint='Ya estás en el peso mínimo: la próxima vez, versión fácil.'; }
  }
  return res;
}

function fcmax(){ return +S.settings.fcmax || Math.round(208 - 0.7*(+S.settings.edad||50)); }
function zonas(){
  if(S.settings.custom && Array.isArray(S.settings.zonas) && S.settings.zonas.every(z=>z[0]&&z[1])) return S.settings.zonas.map(z=>[+z[0],+z[1]]);
  const max=fcmax(), rest=+S.settings.fcrep, P=[[.5,.6],[.6,.7],[.7,.8],[.8,.9],[.9,1]];
  return P.map(([a,b])=> rest ? [Math.round(rest+a*(max-rest)),Math.round(rest+b*(max-rest))] : [Math.round(a*max),Math.round(b*max)]);
}

function buildCasa(r){
  const lv = LV[S.settings.nivel]||LV[2], ph=[];
  WARM.forEach((k,i)=>ph.push({k:'warm',ex:k,sec:60,tag:'Calentamiento',info:`${i+1}/${WARM.length}`}));
  if(r.eq){
    ph.push({k:'rest',sec:r.eq==='b'?120:60,long:true,setup:0});
    r.bloques[0].filter(k=>EX[k].w).forEach(k=>ph.push({k:'warm',ex:k,sec:30,approx:1,blk:0}));
  }
  r.bloques.forEach((b,bi)=>{
    for(let ro=1;ro<=4;ro++){
      b.forEach((ex,ei)=>{
        const side = EX[ex].uni ? (ro%2?'Derecha':'Izquierda') : '';
        ph.push({k:'work',ex,sec:lv.w,side,tag:`Bloque ${bi+1} · Ronda ${ro}/4`,blk:r.eq?bi:undefined});
        const lastOfBlock = ro===4 && ei===b.length-1;
        const setup = r.eq && lastOfBlock && bi<r.bloques.length-1 ? bi+1 : undefined;
        ph.push({k:'rest',sec:lastOfBlock?60:lv.r,long:lastOfBlock,setup});
      });
    }
  });
  r.core.forEach(([ex,side],i)=>{
    ph.push({k:'work',ex,sec:40,side:side||'',tag:`Core · ${i+1}/${r.core.length}`,core:1});
    if(i<r.core.length-1) ph.push({k:'rest',sec:20});
  });
  return ph;
}

function vProgreso(){

  for(let i=7;i>=0;i--){const s=new Date(ws);s.setDate(s.getDate()-7*i);const L=S.log.filter(l=>inWeek(l.fecha,s));
    weeks.push({lbl:`${s.getDate()}/${s.getMonth()+1}`,c:L.filter(l=>l.tipo==='casa').reduce((a,l)=>a+(+l.min||0),0),r:L.filter(l=>l.tipo==='correr').reduce((a,l)=>a+(+l.min||0),0)})}
  const mx=Math.max(60,...weeks.map(w=>w.c+w.r));

    return `<rect x="${x}" y="${H-20-hr}" width="${bw}" height="${hr}" rx="5" fill="var(--run)"/><rect x="${x}" y="${H-20-hr-hc-(hc&&hr?2:0)}" width="${bw}" height="${hc}" rx="5" fill="var(--casa)"/><text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="700">${w.lbl}</text>`}).join('');
  const hist=[...S.log].sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.ts||0)-(a.ts||0));

  <div class="grid3">
    <div class="card stat"><b>${month.length}</b><span>sesiones mes</span></div>
    <div class="card stat"><b>${Math.round(month.reduce((a,l)=>a+(+l.min||0),0)/60*10)/10}</b><span>horas mes</span></div>

  </div>
  <div class="card">
    <div class="row between"><span class="bold">Minutos por semana</span><span class="tiny muted row" style="gap:10px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--casa)"></i> Casa</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--run)"></i> Correr</span></span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:10px">${bars}</svg>

  <div class="card">

    <button class="btn block" style="margin-top:6px" onclick="openBody()">＋ Añadir medidas</button>
    <p class="tiny muted" style="margin:10px 2px 0">En recomposición el peso puede quedarse igual mientras la cintura baja: es buena señal. Mídete en ayunas, el mismo día cada 1-2 semanas.</p>

function cargasHTML(){

function bodyChart(f,lbl,u,col){

function setS(k,v){ S.settings[k]=v; if(k==='custom'&&v&&!S.settings.zonas){ S.settings.zonas=zonasCalc(); } save(); render(); }
function setR(i,v){ v=v.trim().replace('.',':'); if(!/^\d{1,2}:\d{2}$/.test(v)){ toast('Escríbelo como 6:30'); render(); return; } S.settings.ritmos=[...ritmos()]; S.settings.ritmos[i]=v; save(); toast('Ritmo guardado'); }
function zonasCalc(){ const c=S.settings.custom; S.settings.custom=false; const z=zonas(); S.settings.custom=c; return z; }
function setZ(i,j,v){ if(!S.settings.zonas) S.settings.zonas=zonasCalc(); S.settings.zonas[i][j]=+v; save(); }
async function exportData(){
  const name=`entrenos-copia-${today()}.json`, txt=JSON.stringify(S,null,2);
  const mark=()=>{ S.lastBackup=Date.now(); S.backupSnooze=0; save(); render(); };
  try{
    const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Copia de Entrenos'}); mark(); toast('Copia guardada'); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const blob=new Blob([txt],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); mark(); toast('Copia descargada');
}
function importData(f){
  if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.log)) throw 0;
    if(!confirm(`La copia tiene ${d.log.length} entrenos. Sustituirá los datos actuales. ¿Seguimos?`)) return;
    S={...structuredClone(DEF),...d,settings:{...DEF.settings,...(d.settings||{})}}; save(); render(); toast('Copia importada');
  }catch(e){ toast('Ese archivo no es una copia válida'); } };
  rd.readAsText(f);
}

  drawLog();
}

function setFb(i,v){
  const f=LOGF, rr=CASA.find(x=>x.id===f.ref), sc=$('#sheet').scrollTop;
  document.querySelectorAll('#sheet textarea').forEach(t=>f.nota=t.value);
  f.fb[i]=f.fb[i]===v?null:v; f.plan[i]=decide(rr,i,f.fb[i],f.snap.pesos[i]); f.next[i]=[...f.plan[i].next];
  drawLog(); $('#sheet').scrollTop=sc;
}
function drawLog(){
  initLogCasa();
  const f=LOGF, isC=f.tipo==='casa';
  const opts = isC ? [...CASA.map(r=>[r.id,`${r.id} · ${r.nombre}`]),['otra','Otra rutina']] : [['libre','Carrera libre (Z2)'],...RUN.map(r=>[r.id,(r.cod?r.cod+' · ':'')+r.nombre])];
  openSheet(`<div class="row between"><h3>${f.fromPlayer?'¡Sesión terminada! 🎉':'Registrar entreno'}</h3><button class="iconbtn" onclick="closeSheet()">✕</button></div>
  ${f.fromPlayer?`<p class="small muted" style="margin:2px 0 6px">${f.parcial?'Guardamos lo que has hecho, que también cuenta.':'Apunta cómo ha ido antes de estirar.'}</p>`:''}
  ${f.fromPlayer?'':`<div class="seg" style="margin-top:10px"><button class="${isC?'on':''}" onclick="LOGF.tipo='casa';LOGF.ref=nextCasa().id;LOGF.min=50;drawLog()">Casa</button><button class="${!isC?'on':''}" onclick="LOGF.tipo='correr';LOGF.ref='libre';LOGF.min=30;drawLog()">Correr</button></div>`}
  <label class="f">Sesión</label><select class="in" onchange="LOGF.ref=this.value;drawLog()">${opts.map(([v,t])=>`<option value="${v}" ${v===f.ref?'selected':''}>${t}</option>`).join('')}</select>
  <div class="grid2"><div><label class="f">Fecha</label><input class="in" type="date" value="${f.fecha}" onchange="LOGF.fecha=this.value"></div>
  <div><label class="f">Minutos</label><input class="in" type="number" inputmode="numeric" value="${f.min}" onchange="LOGF.min=+this.value"></div></div>
  ${!isC?`<div class="grid2"><div><label class="f">Km (opcional)</label><input class="in" type="number" step="0.01" inputmode="decimal" placeholder="4,5" value="${f.km}" onchange="LOGF.km=this.value.replace(',','.')"></div>
  <div><label class="f">FC media (opcional)</label><input class="in" type="number" inputmode="numeric" placeholder="125" value="${f.fc}" onchange="LOGF.fc=this.value"></div></div>`:''}
  ${(()=>{const rr=isC&&CASA.find(x=>x.id===f.ref); if(!rr||!rr.eq||!f.snap||f.snap.ref!==f.ref) return '';
    return `<label class="f">¿Cómo te ha ido cada bloque?</label>${rr.bloques.map((b,i)=>{const pl=f.plan[i]; return `<div class="fbk">
      <div class="small bold">${i+1}. ${b.map(k=>EX[k].n).join(' + ')} <span class="muted">· ${blkTxt(f.snap.pesos[i])} kg</span></div>
      <div class="seg sm" style="margin-top:8px">${[[-1,'Me ha costado'],[0,'Bien'],[1,'Me ha sobrado']].map(([v,t])=>`<button class="${f.fb[i]===v?'on':''}" onclick="setFb(${i},${v})">${t}</button>`).join('')}</div>
      <div class="row between" style="margin-top:8px;gap:10px;align-items:flex-start"><span class="tiny muted bold" style="padding-top:11px">PRÓXIMA VEZ</span><div>${pesoSelect(rr,i,false,f.next[i],j=>`LOGF.next[${i}][${j}]=+this.value`)}</div></div>
      ${pl&&pl.hint?`<div class="tiny" style="margin-top:6px;color:var(--soft)">${pl.hint}</div>`:''}</div>`}).join('')}`})()}
  <label class="f">¿Cómo de duro ha sido? <span id="rpeT" style="color:var(--text)">${f.rpe} · ${RPE_TXT[f.rpe]}</span></label>
  <input type="range" min="1" max="10" value="${f.rpe}" style="accent-color:${isC?'var(--casa)':'var(--run)'}" oninput="LOGF.rpe=+this.value;$('#rpeT').textContent=this.value+' · '+RPE_TXT[this.value]">
  <label class="f">Notas (opcional)</label><textarea class="in" rows="2" placeholder="${isC?'p. ej. flexiones ya en el suelo':'p. ej. buenas sensaciones, algo de calor'}" onchange="LOGF.nota=this.value">${esc(f.nota)}</textarea>
  <button class="btn ${isC?'casa':'run'} block" style="margin-top:18px" onclick="saveLog()">Guardar</button>`);
}
function saveLog(){
  const f=LOGF; const isC=f.tipo==='casa';
  // leer campos por si no se disparó onchange
  document.querySelectorAll('#sheet textarea').forEach(t=>f.nota=t.value);
  let titulo;
  if(isC){ const r=CASA.find(x=>x.id===f.ref); titulo=r?`${r.nombre} · ${r.sub}`:'Rutina en casa'; }
  else { const s=RUN.find(x=>x.id===f.ref); titulo=s?(s.cod?s.cod+' · ':'')+s.nombre:'Carrera libre'; }
  const e={id:uid(),ts:Date.now(),fecha:f.fecha||today(),tipo:f.tipo,ref:f.ref,titulo,min:+f.min||0,rpe:+f.rpe,nota:f.nota.trim()};
  if(isC){ e.nivel=+S.settings.nivel; const rr=CASA.find(x=>x.id===f.ref);
    if(rr&&rr.eq&&f.snap&&f.snap.ref===f.ref){
      e.pesos=f.snap.pesos; if(f.fb.some(x=>x!=null)) e.bloques=[...f.fb];
      S.pesos=S.pesos||{}; S.pesos[rr.id]=f.next.map(a=>[...a]);
      S.var=S.var||{}; f.plan.forEach(pl=>pl&&Object.assign(S.var,pl.vars));
    } }
  if(!isC){ if(f.km) e.km=Math.round(parseFloat(f.km)*100)/100; if(f.fc) e.fc=+f.fc; }
  S.log.push(e);
  if(isC){ const idx=CASA.findIndex(r=>r.id===f.ref); if(idx>=0&&idx===(S.nextCasa||0)%CASA.length) S.nextCasa=(idx+1)%CASA.length; }
  save(); closeSheet(); render(); toast(isC?'Rutina guardada 💪':(PLAN.some(p=>p.id===f.ref)?'Carrera guardada 🏃 · ya toca la siguiente':'Carrera guardada 🏃'));
}
function openBody(){
  const last=[...S.body].sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]||{};
  openSheet(`<div class="row between"><h3>Medidas</h3><button class="iconbtn" onclick="closeSheet()">✕</button></div>
  <label class="f">Fecha</label><input id="bF" class="in" type="date" value="${today()}">
  <div class="grid2"><div><label class="f">Cintura (cm)</label><input id="bC" class="in" type="number" step="0.1" inputmode="decimal" placeholder="${last.cintura||''}"></div>
  <div><label class="f">Peso (kg)</label><input id="bP" class="in" type="number" step="0.1" inputmode="decimal" placeholder="${last.peso||''}"></div></div>
  <p class="tiny muted">Cintura a la altura del ombligo, sin apretar, al final de soltar el aire.</p>
  <button class="btn casa block" style="margin-top:14px" onclick="saveBody()">Guardar</button>`);
}
function saveBody(){
  const c=parseFloat(($('#bC').value||'').replace(',','.')), p=parseFloat(($('#bP').value||'').replace(',','.')), f=$('#bF').value||today();
  if(!c&&!p){ toast('Pon al menos una medida'); return; }
  S.body=S.body.filter(b=>b.fecha!==f); const e={fecha:f}; if(c) e.cintura=c; if(p) e.peso=p; S.body.push(e);
  save(); closeSheet(); render(); toast('Medidas guardadas');
}

/* =========================================================
   REPRODUCTOR GUIADO
   ========================================================= */
let P=null, actx=null, wakeLock=null;
function beep(freq=880,dur=.12,vol=.25){
  if(!S.settings.sonido) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
let VOICE=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); VOICE=v.find(x=>x.lang==='es-ES')||v.find(x=>x.lang&&x.lang.startsWith('es'))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(t){
  if(!S.settings.voz||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; if(VOICE) u.voice=VOICE; u.rate=1.02; speechSynthesis.speak(u); }catch(e){}
}
async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(P&&!P.paused&&document.visibilityState==='visible') keepAwake(); });

function startCasa(id){ const r=CASA.find(x=>x.id===id); startPlayer({tipo:'casa',ref:id,titulo:r.nombre,ph:buildCasa(r),color:'var(--casa)'}); }
function doneRun(id){ closeSheet(); openLog({tipo:'correr',ref:id}); }
function startPlayer(o){
  closeSheet();
  P={...o,i:0,paused:false,endAt:0,remain:o.ph[0].sec,doneSec:0,lastBeep:null,total:totalSec(o.ph)};
  beep(660,.05,.01); // desbloquea audio en iOS con el toque
  $('#player').classList.remove('hidden'); document.body.style.overflow='hidden';
  keepAwake(); phaseStart(true);
  P.timer=setInterval(tick,200);
}
function phaseColor(p){ if(p.k==='run') return zc(p.z); if(p.k==='work') return P.color; if(p.k==='warm') return 'var(--z3)'; return 'var(--z1)'; }
function nextWorkName(i){ for(let j=i+1;j<P.ph.length;j++){ const q=P.ph[j]; if(q.k!=='rest') return q; } return null; }
function phaseStart(first){
  const p=P.ph[P.i]; P.endAt=Date.now()+p.sec*1000; P.remain=p.sec; P.lastBeep=null;
  drawPlayer();
  if(!first) beep(1046,.25,.3);
  if(p.k==='work'){ const v=varOf(p.ex); say(`${EX[p.ex].n}${v&&EX[p.ex].f?(v>0?', versión difícil':', versión fácil'):''}${p.side?', '+p.side.toLowerCase():''}. ${p.sec} segundos.`); }
  else if(p.approx) say(`Serie de aproximación: ${EX[p.ex].n}. Pocas repeticiones, lentas, sin cansarte.`);
  else if(p.k==='warm') say(first?`Empezamos calentando. ${EX[p.ex].n}.`:EX[p.ex].n);
  else if(p.k==='rest'&&p.setup!=null){ const rr=CASA.find(x=>x.id===P.ref), mt=montaje(rr,p.setup);
    say(`${p.setup?'Cambia los discos':(rr.eq==='b'?'Monta la barra larga':'Monta las mancuernas')}. ${mt.voz.replace(/ \+ /g,', ')}.`); }
  else if(p.k==='rest'){ const n=nextWorkName(P.i); say(p.long?`Descanso de un minuto. ${n?'Siguiente bloque: '+EX[n.ex].n:''}`:`Descanso. Siguiente, ${n?EX[n.ex].n:''}`); }
  else if(p.k==='run'){ const r=rango(p.zl,p.zh); const mi=Math.floor(p.sec/60), se=p.sec%60;
    const dur=mi?`${mi} ${mi===1?'minuto':'minutos'}${se?' y '+se+' segundos':''}`:`${se} segundos`;
    const zt=p.zh===0?'muy suave':(p.zl===p.zh?`en zona ${p.zh}`:`entre zona ${Math.max(1,p.zl)} y ${p.zh}`);
    say(`${p.title}. ${dur} ${zt}${p.zh?', de '+r.bpm.replace('–',' a ')+' pulsaciones':''}.`); }
}
function tick(){
  if(!P||P.paused) return;
  const now=Date.now();
  P.remain=Math.max(0,(P.endAt-now)/1000);
  const r=Math.ceil(P.remain);
  if(r<=3&&r>=1&&P.lastBeep!==r&&P.ph[P.i].sec>5){ P.lastBeep=r; beep(880,.1,.22); }
  if(now>=P.endAt){
    P.doneSec+=P.ph[P.i].sec;
    if(P.i>=P.ph.length-1){ finishPlayer(false); return; }
    P.i++; phaseStart(false); return;
  }
  updateClock();
}
function updateClock(){
  const p=P.ph[P.i]; const c=2*Math.PI*112;
  const el=$('#plNum'); if(el) el.textContent=mmss(Math.ceil(P.remain));
  const rg=$('#plRing'); if(rg) rg.style.strokeDashoffset = c*(1-P.remain/p.sec);
  const tl=$('#plLeft'); if(tl){ const left=P.total-P.doneSec-(p.sec-P.remain); tl.textContent=`Quedan ${mmss(left)}`; }
}
function drawPlayer(){
  const p=P.ph[P.i], col=phaseColor(p), c=2*Math.PI*112;
  const el=$('#player'); el.style.setProperty('--ph',col);
  let tag, name, sub='', body='';
  if(p.k==='run'){
    const r=rango(p.zl,p.zh); tag=`${ZL(p.zl,p.zh)} · ${ZN[p.zh]}`; name=p.title;
    body=`<div class="bpm">${r.bpm} <small>ppm</small></div><div class="pl-sub" style="font-size:17px">${r.pace} min/km</div>`;
  } else if(p.k==='rest'&&p.setup!=null){
    const rr=CASA.find(x=>x.id===P.ref), mt=montaje(rr,p.setup);
    tag=p.setup?'Cambia los discos':(rr.eq==='b'?'Monta la barra':'Monta las mancuernas');
    name=mt.name; sub=mt.sub;
    body=`<div class="pl-cues">Bloque ${p.setup+1}: ${rr.bloques[p.setup].map(k=>EX[k].n).join(' + ')}${p.setup?'':(rr.eq==='b'?'<br>Une las barras cortas a la larga y aprieta bien los cierres.':'<br>Aprieta bien las roscas antes de empezar.')}</div>`;
  } else if(p.k==='rest'){
    const n=nextWorkName(P.i);
    tag=p.long?'Descanso largo':'Descansa'; name=n?`Prepárate: ${EX[n.ex].n}`:'Respira';
    sub=n&&n.side?`Lado ${n.side.toLowerCase()}`:(n?n.tag:'');
    body=n?`<div class="pl-cues">${EX[n.ex].d}</div>`:'';
  } else {
    const e=EX[p.ex];
    tag=p.approx?'Serie de aproximación':p.k==='warm'?`Calentamiento ${p.info}`:(p.core?'Core':'¡Dale!'); name=e.n;
    const rr=CASA.find(x=>x.id===P.ref), v=p.approx?0:varOf(p.ex);
    sub=[p.blk!=null&&e.w&&rr?cargaTxt(rr,p.blk,p.ex):'',p.side?`Lado ${p.side.toLowerCase()}`:'',p.k==='work'?p.tag:''].filter(Boolean).join(' · ');
    body=p.approx?`<div class="pl-cues">Pocas repeticiones, lentas y con buena técnica: es para preparar el cuerpo para el peso, no para cansarte.${e.uni?' Mitad del tiempo con cada lado.':''}</div>`
      :`${v&&e.f?`<div class="pl-cues" style="margin-bottom:6px"><b style="color:var(--ph)">${VAR_TXT[v]}:</b> ${v>0?e.h:e.f}</div>`:''}<div class="pl-cues">${e.d}</div>${e.f?`<div class="pl-var" id="plVar"><button onclick="toggleVar()">Ver variantes</button></div>`:''}`;
  }
  // siguiente
  const nx=P.ph[P.i+1]; let nxt='Último tramo 💪';
  if(nx){ if(nx.k==='run') nxt=`<b>${ZL(nx.zl,nx.zh)}</b> · ${esc(nx.title)} · ${mmss(nx.sec)}`; else if(nx.k==='rest') { const n=nextWorkName(P.i+1); nxt=`Descanso ${nx.sec}″${n?` → ${EX[n.ex].n}`:''}`; } else nxt=`${EX[nx.ex].n}${nx.side?' ('+nx.side.toLowerCase()+')':''} · ${nx.sec}″`; }
  // segmentos de progreso (agrupados por bloques aproximados)
  const N=Math.min(P.ph.length,40), per=P.ph.length/N;
  const segs=Array.from({length:N},(_,k)=>`<i class="${(k+1)*per<=P.i+0.001?'done':''}"></i>`).join('');
  el.innerHTML=`
  <div class="pl-top"><button class="iconbtn" onclick="askQuit()" aria-label="Salir">✕</button>
    <div style="text-align:center"><div class="bold">${esc(P.titulo)}</div><div class="tiny muted bold" id="plLeft"></div></div>
    <button class="iconbtn" onclick="toggleSound()" aria-label="Sonido">${S.settings.voz||S.settings.sonido?'🔊':'🔇'}</button></div>
  <div class="pl-segs">${segs}</div>
  <div class="pl-main">
    <span class="pl-tag">${tag}</span>
    <div class="pl-name">${esc(name)}</div>
    ${sub?`<div class="pl-sub">${esc(sub)}</div>`:''}
    <div class="ring"><svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="112" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="plRing" cx="125" cy="125" r="112" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0" style="transition:stroke-dashoffset .2s linear"/></svg>
      <div class="num"><b id="plNum">${mmss(P.remain)}</b><span>${P.paused?'EN PAUSA':''}</span></div></div>
    ${body}
  </div>
  <div class="pl-next"><span class="muted small bold">SIGUE</span><span class="grow">${nxt}</span></div>
  <div class="pl-ctrl">
    <button class="iconbtn" onclick="jump(-1)" aria-label="Anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="play" onclick="togglePause()" aria-label="Pausa">${P.paused?icoPlay(32):'<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'}</button>
    <button class="iconbtn" onclick="jump(1)" aria-label="Siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>`;
  updateClock();
}
function toggleVar(){ const p=P.ph[P.i]; const e=EX[p.ex]; const v=$('#plVar'); if(v) v.innerHTML=`<b>Más fácil:</b> ${e.f}<br><b>Más difícil:</b> ${e.h}`; }
function toggleSound(){ const on=!(S.settings.voz||S.settings.sonido); S.settings.voz=on; S.settings.sonido=on; save(); if(!on) try{speechSynthesis.cancel()}catch(e){} drawPlayer(); }
function togglePause(){
  if(P.paused){ P.paused=false; P.endAt=Date.now()+P.remain*1000; keepAwake(); }
  else { P.paused=true; P.remain=Math.max(0,(P.endAt-Date.now())/1000); try{speechSynthesis.cancel()}catch(e){} }
  drawPlayer();
}
function jump(d){
  const p=P.ph[P.i];
  if(d>0){ P.doneSec+=p.sec; if(P.i>=P.ph.length-1){ finishPlayer(false); return; } P.i++; }
  else { if(p.sec-P.remain>3||P.i===0){ /* reinicia el tramo */ } else { P.i--; P.doneSec=Math.max(0,P.doneSec-P.ph[P.i].sec); } }
  const wasPaused=P.paused; P.paused=false; phaseStart(true); if(wasPaused){ P.paused=true; drawPlayer(); }
}
function askQuit(){
  const wasPaused=P.paused; if(!wasPaused) togglePause();
  const done=Math.round((P.doneSec+(P.ph[P.i].sec-P.remain))/60);
  openSheet(`<h3>¿Terminar aquí?</h3><p class="small muted">Llevas ${done} min.</p>
  ${done>=5?`<button class="btn ${P.tipo==='casa'?'casa':'run'} block" onclick="closeSheet();finishPlayer(true)">Guardar lo hecho</button>`:''}
  <button class="btn block" style="margin-top:8px" onclick="closeSheet();stopPlayer()">Salir sin guardar</button>
  <button class="btn block" style="margin-top:8px" onclick="closeSheet();${wasPaused?'':'togglePause()'}">Seguir entrenando</button>`);
}
function stopPlayer(){
  if(!P) return; clearInterval(P.timer); try{speechSynthesis.cancel()}catch(e){}
  try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null;
  $('#player').classList.add('hidden'); document.body.style.overflow=''; P=null; render();
}
function finishPlayer(parcial){
  const o=P; const secs=parcial?(o.doneSec+(o.ph[o.i].sec-o.remain)):o.total;
  if(!parcial){ beep(784,.15,.3); setTimeout(()=>beep(1046,.3,.3),180); say('Sesión terminada. ¡Muy bien!'); }
  stopPlayer();
  openLog({tipo:o.tipo,ref:o.ref,min:Math.max(1,Math.round(secs/60)),fromPlayer:true,parcial});
}

/* =========================================================
   ICONO PARA PANTALLA DE INICIO
   ========================================================= */
(function makeIcon(){
  try{
    const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180); g.addColorStop(0,'#FF6B4A'); g.addColorStop(1,'#3CC9A8');
    x.fillStyle='#111318'; x.fillRect(0,0,180,180);
    x.lineWidth=18; x.strokeStyle=g; x.lineCap='round';
    x.beginPath(); x.arc(90,90,52,-Math.PI/2,Math.PI*1.25); x.stroke();
    x.fillStyle='#F3F1EC'; x.beginPath(); x.arc(90,90,14,0,Math.PI*2); x.fill();
    const u=c.toDataURL('image/png'); $('#touchIcon').href=u; $('#favIcon').href=u;
  }catch(e){}
})();

render();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
